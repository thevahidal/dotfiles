# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Mouse: scroll history, drag-select to copy, click/resize panes.
# Hold Option while dragging if you want Ghostty native selection instead.
set -g mouse on

# Push selections to system clipboard via OSC 52 (Ghostty supports this).
set -s set-clipboard on

# OSC 8 clickable hyperlinks (ng serve / agent / django URLs).
# Without this, tmux strips link escapes and clicks do nothing.
set -as terminal-features '*:hyperlinks'
set -g allow-passthrough on

# Mouse select copies but stays in scrollback (no jump-to-bottom).
# Default is copy-pipe-and-cancel, which exits copy-mode → live edge.
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-no-clear
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-no-clear
bind -T copy-mode    DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-no-clear
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-no-clear
bind -T copy-mode    TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-no-clear

# Click OSC 8 link while scrolled → open it, stay put (q still exits).
bind -T copy-mode-vi MouseDown1Pane {
  select-pane
  if-shell -F '#{mouse_hyperlink}' {
    run-shell 'open #{q:mouse_hyperlink}'
  }
}
bind -T copy-mode MouseDown1Pane {
  select-pane
  if-shell -F '#{mouse_hyperlink}' {
    run-shell 'open #{q:mouse_hyperlink}'
  }
}
