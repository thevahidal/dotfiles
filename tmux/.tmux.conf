# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Mouse: scroll history, drag-select to copy, click/resize panes.
# Hold Option while dragging if you want Ghostty native selection instead.
set -g mouse on

# Push selections to system clipboard via OSC 52 (Ghostty supports this).
set -s set-clipboard on

# OSC 8 clickable hyperlinks (ng serve / agent / django URLs).
# Without this, tmux strips link escapes and clicks do nothing.
set -as terminal-features '*:hyperlinks'
set -g allow-passthrough on
